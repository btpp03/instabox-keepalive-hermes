name: instabox keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run keepalive
        id: ka
        continue-on-error: true
        env:
          INSTABOX_KEY: ${{ secrets.INSTABOX_KEY }}
          MACHINES: ibox-01,ibox-03
        run: python3 keepalive.py
      - name: result (never fail the job -> no failure email)
        env:
          OUTCOME: ${{ steps.ka.outcome }}
        run: |
          echo "keepalive outcome: $OUTCOME"
          case "$OUTCOME" in
            success) echo "::notice title=keepalive::all good";;
            *) echo "::warning title=keepalive::部分机器没起来（冷却/挂起），见上一步日志";;
          esac
